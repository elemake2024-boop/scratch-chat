<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>リアルタイムチャット</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="panel">
      <header>
        <input id="display-name" class="name-input" type="text" maxlength="24" aria-label="ユーザー名" title="ユーザー名を変更">
        <span id="lock-indicator" hidden>ロック中</span>
        <div class="header-right">
          <select id="color">
            <option value="red">赤</option>
            <option value="blue">青</option>
            <option value="yellow">黄</option>
            <option value="green">緑</option>
            <option value="white" selected>白</option>
          </select>
          <span id="status" class="connecting" role="status">接続中</span>
        </div>
      </header>
      <div id="lock-screen" tabindex="-1" hidden>
        <img src="/lock-screen.svg" alt="STOP! 管理者のロック解除をお待ちください。">
      </div>
      <div id="maintenance-screen" tabindex="-1" hidden>
        <img src="/maintenance-screen.png" alt="メンテナンス中です。チャット履歴が消去されます。再開までしばらくお待ちください。">
      </div>
      <section id="chat">
        <div id="screens" aria-label="画面共有"></div>
        <div id="pinned-message" hidden></div>
        <div id="messages" aria-live="polite"></div>
        <div id="reply-preview" hidden></div>
        <form id="message-form">
          <div class="composer">
            <textarea id="text" maxlength="4000" placeholder="メッセージを入力"></textarea>
            <div class="actions">
              <div id="admin-settings" class="settings-menu" hidden>
                <button id="admin-settings-toggle" class="icon-button" type="button" aria-label="管理者メニューを開く" title="管理者メニュー" aria-expanded="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" /><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z" /></svg>
                </button>
                <div id="admin-settings-menu" class="attachment-menu-items" hidden>
                  <div class="admin-menu-title">管理者メニュー</div>
                  <button id="admin-lock-toggle" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
                    <span>ロックモードを開始</span>
                  </button>
                  <button id="admin-maintenance-toggle" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 18 2l4 4-4 4M13 7 3 17a2.8 2.8 0 0 0 4 4L17 11" /><path d="m5 5 4 4" /></svg>
                    <span>メンテナンスモードを開始</span>
                  </button>
                </div>
              </div>
              <div class="attachment-menu">
                <button id="attachment-menu-toggle" class="icon-button" type="button" aria-label="添付メニューを開く" title="添付メニューを開く" aria-expanded="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-7-7h14" /></svg>
                </button>
                <div id="attachment-menu" class="attachment-menu-items" hidden>
                  <button id="pin-next" type="button" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-4 1-3 3v5l-2 2-2-6-4-4 2-2h5l3-3zM5 19l4-4" /></svg>
                    <span>次のメッセージをピン留め</span>
                  </button>
                  <label class="attachment-option" title="写真・動画を添付（最大330MB）">
                    <input id="file" type="file" accept="image/*,video/*">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="8.5" cy="9" r="1.5" /><path d="m21 15-5-5L5 20" /></svg>
                    <span>写真・動画</span>
                  </label>
                </div>
              </div>
              <button id="share" class="icon-button" type="button" title="画面共有" aria-label="画面共有">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2" /><path d="M8 21h8m-4-4v4" /></svg>
              </button>
              <button class="send-button" type="submit" title="送信" aria-label="送信">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></svg>
              </button>
            </div>
          </div>
          <div id="file-name"></div>
        </form>
      </section>
    </main>
    <script src="/client.js"></script>
  </body>
</html>
